# Proxy inverso de la plataforma: nginx, variante A (docs/10 §8.4 decisión 10; docs/10 §2 y §6).
# Termina TLS en 443 (personas: API, panel, SSE) y en 8883 (dispositivos: MQTT) y reenvía en claro dentro de la red
# interna de Docker. Lo que la variante A pierde está escrito en docs/10: el broker ve la IP del proxy, no la del
# dispositivo (la IP real queda en el registro de este proxy). Un solo archivo, sin includes: lo que rige se lee aquí.
# Certificados en /certs (servidor.crt, servidor.key): en desarrollo los crea proxy/ca-desarrollo.sh; en el servidor,
# la CA que se decida (docs/10 §8.4 punto 22: Let's Encrypt por ACME o CA propia).
# Este archivo es una PLANTILLA: el compose lo monta en /plantilla/nginx.conf.template y la imagen oficial, al arrancar,
# sustituye solo las variables PROXY_* (filtro ^PROXY_: PROXY_NOMBRE y PROXY_SECRETO) y escribe /etc/nginx/nginx.conf. Las demás
# ($host, $status…) son de nginx y quedan intactas. PROXY_NOMBRE es el nombre público del servidor (.env); sin definir, localhost.
# PROXY_SECRETO es obligatorio con esta capa (compose.proxy.yml): sin él el proxy no arranca.
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }

# ── Dispositivos: MQTT sobre TLS, 8883 → mosquitto:1883 ──────────────────────────────────────────────────────────
stream {
    # Una línea JSON por conexión (docs/10 §6): quién se conectó, cuánto duró, cuánto movió. Es el único lugar donde
    # queda la IP real del dispositivo en la variante A.
    log_format mqtt escape=json '{"t":"$time_iso8601","proto":"mqtt","ip":"$remote_addr","estado":"$status",'
                                '"bytes_in":$bytes_received,"bytes_out":$bytes_sent,"dur_s":$session_time}';
    access_log /dev/stdout mqtt;

    server {
        listen 8883 ssl;
        ssl_certificate     /certs/servidor.crt;
        ssl_certificate_key /certs/servidor.key;
        ssl_protocols       TLSv1.2 TLSv1.3;            # docs/10 §2: TLS 1.2 o superior
        ssl_session_cache   shared:mqtt:1m;
        # Resolver en cada conexión con el DNS interno de Docker, no una vez al arrancar: si el broker se recrea con
        # otra IP, el proxy lo sigue (y `nginx -t` pasa aunque el nombre no exista fuera de la red de Compose).
        resolver            127.0.0.11 valid=10s ipv6=off;
        set $broker         mosquitto:1883;
        proxy_pass          $broker;
        proxy_connect_timeout 5s;
        proxy_timeout       1h;                          # una sesión MQTT viva con keepalive no es un «timeout»
    }
}

# ── Personas: HTTPS, 443 → backend:3000 ──────────────────────────────────────────────────────────────────────────
http {
    log_format api escape=json '{"t":"$time_iso8601","proto":"http","ip":"$remote_addr","met":"$request_method",'
                               '"ruta":"$uri","estado":$status,"bytes":$body_bytes_sent,"dur_s":$request_time}';
    access_log /dev/stdout api;
    server_tokens off;                                   # no se anuncia la versión (docs/11)

    # Lista de nombres de host (docs/11 §3, docs/10 §8.4 punto 40, 12/10/2026): se atiende SOLO el nombre público. Cualquier otro
    # (el de una página que hace DNS rebinding, o un escaneo por IP) cae en este servidor por defecto, que rechaza el saludo
    # TLS (SNI desconocido) y no entrega ni el certificado. El backend repite el control con su propia lista (HTTP_HOSTS).
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ${PROXY_NOMBRE};
        ssl_certificate     /certs/servidor.crt;
        ssl_certificate_key /certs/servidor.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:api:1m;
        # HSTS lo pone el proxy, no el backend (docs/11 §5: «sin HSTS en el backend, lo pondrá el proxy TLS»).
        add_header Strict-Transport-Security "max-age=31536000" always;

        resolver 127.0.0.11 valid=10s ipv6=off;        # ídem: el backend se recrea en cada `up --build`
        set $backend http://backend:3000;

        location / {
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $http_host;                # con puerto: el canal SSE compara Origin con Host ($host lo quita y el banco, en 8443, se rechazaba)
            proxy_set_header   X-Forwarded-For $remote_addr;
            # Prueba de que la petición viene de este proxy (docs/10 §8.4 punto 52): con el secreto, el backend cree X-Forwarded-For.
            # Si PROXY_SECRETO está vacío, nginx no manda una cabecera vacía, y el backend usa la dirección del socket.
            proxy_set_header   X-Proxy-Secreto "${PROXY_SECRETO}";
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Connection "";
            proxy_buffering    off;                      # SSE (decisión 1): cada evento sale al navegador al instante
            proxy_read_timeout 1h;                       # una conexión SSE abierta tampoco es un «timeout»
        }
    }

    # Puerto 80: solo redirige a HTTPS (y alojará el reto ACME si se elige Let's Encrypt, docs/10 §8.4 punto 22). Sin TLS no se sirve nada.
    # Solo para el nombre público; cualquier otro Host se corta sin respuesta (444). En 443 el equivalente es el saludo TLS
    # rechazado (SNI ajeno) o el 421 (SNI propio con otro Host).
    server {
        listen 80 default_server;
        return 444;
    }
    server {
        listen 80;
        server_name ${PROXY_NOMBRE};
        return 301 https://$host$request_uri;
    }
}
