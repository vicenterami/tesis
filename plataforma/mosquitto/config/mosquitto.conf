# Configuración del broker — desarrollo local.
# Principio: nadie publica ni se suscribe sin credencial, y cada dispositivo solo
# puede escribir en su propio tópico (ACL). En producción el listener 1883 queda
# interno y el proxy expone 8883 con TLS.

listener 1883
protocol mqtt

# Sin acceso anónimo: toda conexión debe autenticarse (RF-40, RNF-08).
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Tope por mensaje: 64 KiB (decisión del 07/10/2026, docs/11 §4). Sin él, la versión 2.0.22 aceptó y entregó un mensaje
# de 50 MiB (observado): un dispositivo con credencial válida, robada o mal programada, podría llenar el disco a
# través de cuarentena y trama. Una trama real pesa cientos de bytes; 64 KiB deja margen para lotes de lecturas
# atrasadas. Cuenta el paquete completo (tópico incluido). Al excederlo, el broker corta la conexión y registra
# «disconnected due to oversize packet»: el mensaje nunca llega al backend.
max_packet_size 65536

# Persistencia de sesiones y mensajes retenidos en el volumen.
persistence true
persistence_location /mosquitto/data/

# Registro a la salida estándar (lo lee `docker compose logs`).
log_dest stdout
log_type error
log_type warning
log_type notice
