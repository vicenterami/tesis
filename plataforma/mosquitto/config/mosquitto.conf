# Configuración del broker — desarrollo local.
# Principio: nadie publica ni se suscribe sin credencial, y cada dispositivo solo
# puede escribir en su propio tópico (ACL). En producción el listener 1883 queda
# interno y el proxy expone 8883 con TLS.

listener 1883
protocol mqtt

# Sin acceso anónimo: toda conexión debe autenticarse (RF-40, RNF-08).
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistencia de sesiones y mensajes retenidos en el volumen.
persistence true
persistence_location /mosquitto/data/

# Registro a la salida estándar (lo lee `docker compose logs`).
log_dest stdout
log_type error
log_type warning
log_type notice
