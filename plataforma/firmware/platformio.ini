; Firmware del nodo de prueba ESP32 (TT-32; docs/17 §5 y §6). PlatformIO Core + Arduino-ESP32 (decidido el 13/10/2026).
; Plataforma y bibliotecas fijadas por versión exacta, publicadas hace más de dos semanas al fijarlas (16/10/2026, registro oficial
; de PlatformIO): quien clone el repositorio compila exactamente lo mismo, sin entorno gráfico. PlatformIO Core no se fija aquí:
; se instala con «pip install platformio==6.2.0» (README). Licencias y avisos de terceros: AVISOS-DE-TERCEROS.md.
;   pio run -e diagnostico                 compila la fase 1 (diagnóstico de sensores por el puerto serie)
;   pio run -e diagnostico -t upload       compila y graba la placa (por el puerto que muestre dmesg: ttyUSB0 o ttyACM0)
;   pio run -e nodo -t upload              fase 2: publica por MQTT sobre TLS (antes: include/secretos.h desde secretos.h.ejemplo)
;   pio run -e nodo-prueba-vigia -t upload  prueba el watchdog: el nodo se cuelga a propósito en el ciclo 2 (luego, -e nodo)
;   pio device monitor                     abre el puerto serie a 115200
[platformio]
default_envs = diagnostico

[env]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; 19/10: el monitor no toca DTR ni RTS (en estas placas van a EN y a BOOT): al abrirlo, a veces dejaba la placa retenida o
; reiniciándose en bucle (solo símbolos). Reiniciar es apretar EN; grabar sigue igual (esptool maneja esas líneas por su cuenta).
monitor_dtr = 0
monitor_rts = 0
; Fase 0 (14/10): con esta placa y su cable, la velocidad por defecto de esptool falló al hablar con el chip; a 115200, bien.
upload_speed = 115200
build_flags = -Wall -Wextra

; Fase 1: diagnóstico de los sensores por el puerto serie, sin Wi-Fi (docs/17 §6).
[env:diagnostico]
build_src_filter = +<diagnostico.cpp>
lib_deps =
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6

; Fase 2: Wi-Fi, TLS con la CA propia, MQTT con QoS 1 y SenML hacia la plataforma (docs/17 §6.2). Los secretos, en include/secretos.h.
; 256dpi/MQTT (arduino-mqtt) publicada el 16/04/2026, fijada el 19/10/2026: QoS 1, que docs/10 exige a los nodos Wi-Fi.
[env:nodo]
build_src_filter = +<nodo.cpp>
lib_deps =
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    256dpi/MQTT@2.5.3

; Prueba del watchdog (docs/17 §6.2): el mismo nodo, colgado a propósito en el ciclo 2. Esperado por serie: el aviso PRUEBA_VIGIA y,
; dentro de 120 s, «Task watchdog got triggered» y un reinicio. Solo para probar: después se vuelve a grabar -e nodo.
[env:nodo-prueba-vigia]
extends = env:nodo
build_flags = ${env.build_flags} -DPRUEBA_VIGIA
