# Verificación automática del backend en cada push y pull request (TT-03), y una vez por semana.
# Solo lo que no necesita base ni broker: tipos, lint, pruebas unitarias y auditoría de dependencias. Lo que sí las necesita
# (esquema, migraciones, API) corre en local con plataforma/pruebas/verificar-todo.sh.
name: verificar
on:
  push:
    branches: [main]
    paths: ['plataforma/backend/**', 'plataforma/pruebas/avisos-dependencias.sh', '.github/workflows/verificar.yml']
  pull_request:
    paths: ['plataforma/backend/**', 'plataforma/pruebas/avisos-dependencias.sh', '.github/workflows/verificar.yml']
  # La auditoría cambia aunque el código no (08/10/2026: rojo por avisos publicados después del último push): una corrida
  # semanal los muestra sin esperar al próximo cambio. También se puede lanzar a mano.
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
# Permisos mínimos del token: solo leer el repositorio (la consulta de avisos de GitHub es pública).
permissions:
  contents: read
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plataforma/backend
    steps:
      # Acciones fijadas por SHA, no por etiqueta: una etiqueta se puede reescribir (marzo de 2026, docs/11 §4).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Sin guardar el token en .git/config: ningún paso escribe en el repositorio (08/10/2026).
        with:
          persist-credentials: false
      # v6: runtime node24 (GitHub retiró node20 y anotaba «forced to run on Node.js 24» en cada corrida). La versión de
      # pnpm sale de packageManager en package.json, con su hash.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: plataforma/backend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plataforma/backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verificar
      # SCA: dependencias con vulnerabilidades conocidas (docs/11 §4). Falla con severidad alta o crítica, salvo las
      # excepciones declaradas en pnpm-workspace.yaml (audit.ignore: avisos sin versión corregida que no entran a producción).
      - run: pnpm audit --audit-level=high
      # Lo que va a producción no puede tener ningún aviso, ni siquiera exceptuado: audit.ignore aplica también con --prod,
      # así que el código de salida no basta; el metadata del JSON cuenta todo, incluido lo ignorado (08/10/2026).
      - run: pnpm audit --prod --json | jq -e '.metadata.vulnerabilities | add == 0'
      # Lo pendiente no se esconde (08/10/2026): cada excepción y cada aviso que no bloquea sale como advertencia amarilla en
      # la corrida y en su resumen, sin dejarla en rojo. Corre aunque un paso anterior falle, salvo si se canceló la corrida.
      - name: Dependencias pendientes de resolver (avisa, no bloquea)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../pruebas/avisos-dependencias.sh
