# Despliegue de la plataforma — Etapa 2 (base de datos + broker).
# El backend, el panel, ChirpStack y el proxy TLS se agregan en tandas siguientes,
# a medida que existan. Cada servicio lleva un techo de memoria y CPU: protege al
# servidor y define el entorno de referencia del banco de pruebas (docs/09).
#
# Uso:   cp .env.example .env   (y editar las contraseñas)
#        docker compose up -d
#        docker compose ps · docker compose logs -f · docker stats

name: plataforma

services:

  # ── Base de datos de series de tiempo ───────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.24.0-pg16     # versión fijada: un despliegue reproducible no usa "latest"
    restart: unless-stopped                      # vuelve solo tras un reinicio del servidor
    security_opt:
      - no-new-privileges:true                   # un proceso comprometido no puede escalar privilegios
    environment:
      POSTGRES_DB: ${DB_NOMBRE}
      POSTGRES_USER: ${DB_USUARIO}
      POSTGRES_PASSWORD: ${DB_CLAVE}
    volumes:
      - datos-timescale:/var/lib/postgresql/data           # el dato sobrevive al contenedor
      - ./db/init:/docker-entrypoint-initdb.d:ro           # esquema: se ejecuta solo la 1.ª vez
    healthcheck:                                            # "¿ya acepta conexiones?"
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO} -d ${DB_NOMBRE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    # Sin `ports`: la base de datos NO se expone fuera de la red interna (docs/10 §2).

  # ── Broker MQTT ─────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Sin `ports`: en producción el broker se alcanza solo vía proxy TLS (8883).
    # Para desarrollo local, los puertos se publican en docker-compose.override.yml.
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - datos-mosquitto:/mosquitto/data                    # mensajes retenidos y sesiones
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i sonda -W 3 -u ${MQTT_SONDA_USUARIO} -P ${MQTT_SONDA_CLAVE} >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  datos-timescale:
  datos-mosquitto:

# Red: Compose crea una red interna "plataforma_default" donde cada servicio se
# alcanza por su nombre (p. ej. el backend se conectará a "timescaledb:5432").
