# Capa opcional del proxy inverso (TT-22; docs/10 §8.4 decisión 10, variante A). Se SUMA al compose base:
#   desarrollo:  docker compose -f docker-compose.yml -f docker-compose.override.yml -f proxy/compose.proxy.yml up -d proxy
#   banco:       bash pruebas/banco/banco.sh proxy        (puertos 8443/8884/8081, certificados de desarrollo)
#   servidor:    la misma capa con PROXY_IP=0.0.0.0 y PROXY_CERTS apuntando a los certificados reales (docs/10 §8.4 punto 22)
# Valores por defecto SEGUROS: escucha solo en 127.0.0.1 y usa la CA de desarrollo; exponer a la red es una decisión
# explícita en el .env del servidor. El único contenedor con puertos hacia fuera en producción es este (docs/10 §2).
services:
  proxy:
    build: ./proxy                       # nginx estable fijada en proxy/Dockerfile (stream, HTTP/2, stub_status y ACME)
    image: plataforma-proxy:local        # construida aquí: su versión vive solo en el FROM de proxy/Dockerfile (docs/11 §8)
    restart: unless-stopped
    logging:                           # registros acotados como el resto (docs/11 §4)
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PROXY_CERTS:-../privado/certs-desarrollo}:/certs:ro   # servidor.crt y servidor.key (ca.crt para los clientes)
    ports:
      - "${PROXY_IP:-127.0.0.1}:${PROXY_HTTPS:-443}:443"      # personas: API, panel, SSE
      - "${PROXY_IP:-127.0.0.1}:${PROXY_MQTTS:-8883}:8883"    # dispositivos: MQTT sobre TLS
      - "${PROXY_IP:-127.0.0.1}:${PROXY_HTTP:-80}:80"         # solo redirección a HTTPS (y reto ACME si se elige)
    depends_on:
      backend:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:                         # «¿termina TLS y llega al backend?» (-k: comprueba el camino, no la cadena de confianza)
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://127.0.0.1/salud"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 100M                   # docs/10 §6: 0,1 GB; medido con carga en el banco (docs/16)
          cpus: "0.5"
