# Broker del BANCO DE PRUEBAS desechable (pruebas/banco/compose.banco.yml). NUNCA en producción:
# acepta conexiones sin credencial para que el emulador (TT-28) haga de cien dispositivos sin cien claves.
# Todo lo demás igual al broker real: mismo tope por mensaje, misma versión de imagen.
listener 1883
protocol mqtt
allow_anonymous true
max_packet_size 65536
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
