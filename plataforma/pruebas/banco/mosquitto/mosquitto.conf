# Broker del BANCO DE PRUEBAS desechable (pruebas/banco/compose.banco.yml). NUNCA en producción:
# acepta conexiones sin credencial para que el emulador (TT-28) haga de cien dispositivos sin cien claves (con el plugin,
# un cliente anónimo recibe el acceso por defecto, que banco.sh encender abre solo para publicar; uno que manda usuario
# sin clave se rechaza, medido el 12/10, docs/16 §20). Todo lo demás igual al broker real: mismo plugin de seguridad
# (así el banco prueba el alta por API de punta a punta), mismo tope por mensaje, misma versión de imagen.
listener 1883
protocol mqtt
allow_anonymous true
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
max_packet_size 65536
# Los mismos topes de cola que el servidor (docs/10 §8.4 punto 43): el banco los prueba plantando la violación (banco.sh cola).
max_queued_messages 10000
max_queued_bytes 20971520
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
