# Paquetes del workspace (docs/10 §8.4, decisión del 09/10/2026): el panel vive aquí dentro y comparte lockfile, .npmrc,
# auditoría y guardián con el backend; lo sirve el backend en /panel.
packages:
  - panel
# Decisión explícita sobre scripts de instalación de dependencias (pnpm >= 10 exige declararla;
# desde pnpm 11 la opción se llama `allowBuilds`). `false` = el paquete se instala pero su script
# de instalación NO se ejecuta. Ninguno de estos lo necesita:
#   @nestjs/core  → su postinstall solo imprime un mensaje de donación
#   unrs-resolver → su postinstall descarga un binario; pnpm ya lo instala como dependencia opcional
#   @scarf/scarf  → telemetría: su postinstall avisa a un servidor externo de la instalación; bloqueado
#   @parcel/watcher → preventivo (23/10/2026): aún no está en el lockfile; llega con la actualización de jest que propone
#                   Dependabot. Su postinstall compila un módulo nativo solo si falta el binario; pnpm ya instala el binario
#                   de la plataforma como dependencia opcional
# Si una dependencia futura lo requiere de verdad, se pone en `true` con el porqué al lado.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  unrs-resolver: false
# Versiones corregidas de dependencias transitivas con avisos de seguridad (docs/11 §4): el 23/09/2026 ajv, multer y
# picomatch; el 08/10/2026 el resto (avisos publicados después del 27/09); el 25/10/2026 body-parser, multer, fast-uri y undici
# (avisos del 19 al 23/10). Una línea por versión mayor afectada.
overrides:
  ajv@>=7.0.0-alpha.0 <8.18.0: ^8.18.0
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  handlebars@>=4.0.0 <=4.7.9: ^4.7.10
  ip-address@<=10.7.0: ^10.7.1
  js-yaml@>=5.0.0 <=5.4.0: ^5.4.1
  multer@<2.5.0: ^2.5.0
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  undici@>=8.0.0 <8.12.2: ^8.12.2
# Avisos que la auditoría ignora (docs/11 §4; clave `audit.ignore`, la vigente desde pnpm 11.16): solo los que no tienen
# versión corregida publicada y no entran a la imagen
# de producción. El guardián (paso 2q) falla el día que salga el parche o que GitHub retire el aviso, para quitar la línea.
# Sin excepciones desde el 26/10/2026: la única (GHSA-vfj7-8cjw-p6xm, braces, solo por jest) la retiró GitHub el 23/10.
# Formato, si vuelve a hacer falta:
#   audit:
#     ignore:
#       - GHSA-xxxx-xxxx-xxxx   # paquete · gravedad · sin parche al dd/mm/aaaa · por qué no entra a producción
