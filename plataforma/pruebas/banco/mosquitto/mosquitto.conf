# Broker del BANCO DE PRUEBAS desechable (pruebas/banco/compose.banco.yml). NUNCA en producción:
# acepta conexiones sin credencial para que el emulador (TT-28) haga de cien dispositivos sin cien claves (con el plugin,
# un cliente anónimo recibe el acceso por defecto, que banco.sh encender abre solo para publicar; uno que manda usuario
# sin clave se rechaza, medido el 12/10, docs/16 §20). Salvo las dos diferencias declaradas, igual al broker real: mismo plugin de seguridad
# (así el banco prueba el alta por API de punta a punta), mismo tope por mensaje, misma versión de imagen.
listener 1883
protocol mqtt
# SEGUNDA diferencia deliberada (25/11/2026): sin `use_username_as_clientid`. El servidor la lleva (docs/11 §7) y con ella el broker
# rechaza a todo cliente sin usuario, es decir, a los emulados. Darle una credencial a cada uno (cien claves por «encender», y el
# emulador, los casos correr, carrera, cola y vías y la capa TLS reescritos para usarlas) no prueba nada que no pruebe ya
# pruebas/broker-sesion.sh, que levanta un broker desechable con la configuración del SERVIDOR copiada tal cual y los roles reales, y
# ataca la sesión persistente de tres formas. El guardián 2i exige la opción en la pila y su ausencia declarada aquí.
allow_anonymous true
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
max_packet_size 65536
# Los mismos topes de cola que el servidor (docs/10 §8.4 punto 43): el banco los prueba plantando la violación (banco.sh cola).
max_queued_messages 10000
max_queued_bytes 20971520
# Mismo tope de conexiones que el servidor (docs/10 §8.4 punto 57); el guardián 2l exige que coincidan.
max_connections 1200
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
