# Despliegue de la plataforma — Etapa 3 (base de datos, broker y backend, que sirve el panel en /panel).
# El proxy TLS es la capa proxy/compose.proxy.yml; el panel lo sirve el backend, y ChirpStack solo si se
# activa la ruta A, que es opcional (docs/10 §8.4 punto 2).
# Este archivo es la FORMA DE PRODUCCIÓN: no publica puertos ni activa nada de desarrollo.
# Lo propio del portátil (puertos en 127.0.0.1, /docs) vive en docker-compose.override.yml,
# que Compose suma solo en el equipo de desarrollo y que no se copia al servidor. Cada servicio lleva un techo de memoria y CPU: protege al
# servidor y define el entorno de referencia del banco de pruebas (docs/09).
#
# Uso:   cp .env.example .env   (y editar las contraseñas)
#        docker compose up -d
#        docker compose ps · docker compose logs -f · docker stats

name: plataforma

services:

  # ── Base de datos de series de tiempo ───────────────────────────────────────
  timescaledb:
    build: ./db/imagen                           # FROM fijado (nunca "latest") en db/imagen/Dockerfile; -oss = edición Apache 2.0 (RNF-15, docs/10 §8.4 punto 11)
    image: plataforma-timescaledb:local                  # construida aquí: su versión vive solo en el FROM de db/imagen/Dockerfile (docs/11 §8)
    restart: unless-stopped                      # vuelve solo tras un reinicio del servidor
    logging:                                     # registros acotados: 10 MB × 5 por servicio (docs/11 §4; 07/10/2026)
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # Sin trabajos de fondo de TimescaleDB (docs/10 §8.4 punto 11): en la edición Apache su programador solo corre
    # dos jobs internos, y no se pueden apagar uno a uno (alter_job y delete_job son de la otra licencia):
    #  · «Job History Log Retention Policy»: falla con ERROR de licencia en cada corrida (cada 6 h, observado en 2.24);
    #  · «Telemetry Reporter»: envía a Timescale un informe anónimo de uso cada 24 h; apagado, no sale nada del servidor.
    # La retención la hace el backend con drop_chunks, que es una función y no necesita el programador.
    command: ["postgres", "-c", "timescaledb.max_background_workers=0", "-c", "timescaledb.telemetry_level=off"]
    security_opt:
      - no-new-privileges:true                   # un proceso comprometido no puede escalar privilegios
    cap_drop:
      - NET_RAW                                  # sin sockets crudos no se suplanta una dirección en la red interna (docs/10 §8.4 punto 52)
    environment:
      POSTGRES_DB: ${DB_NOMBRE}
      POSTGRES_USER: ${DB_USUARIO}
      POSTGRES_PASSWORD: ${DB_CLAVE}
    volumes:
      - datos-timescale:/var/lib/postgresql/data           # el dato sobrevive al contenedor
      - ./db/init:/docker-entrypoint-initdb.d:ro           # esquema: se ejecuta solo la 1.ª vez
    healthcheck:                                            # "¿ya acepta conexiones?"
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO} -d ${DB_NOMBRE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    # Sin `ports`: la base de datos NO se expone fuera de la red interna (docs/10 §2).

  # ── Broker MQTT ─────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98 # etiqueta legible + digest exacto (docs/11 §4); Dependabot propone los cambios
    restart: unless-stopped
    logging:                                     # registros acotados: 10 MB × 5 por servicio (docs/11 §4; 07/10/2026)
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW                                  # ídem: la suplantación en la red de Docker exige esta capacidad
    ulimits:                                     # 01/11/2026: max_connections 1200 (mosquitto.conf) necesita más de los 1024
      nofile: { soft: 4096, hard: 4096 }         # descriptores por defecto del contenedor (docs/10 §8.4 punto 57; guardián 2l)
    # Sin `ports`: en producción el broker se alcanza solo vía proxy TLS (8883).
    # Para desarrollo local, los puertos se publican en docker-compose.override.yml.
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - datos-mosquitto:/mosquitto/data                    # sesiones, retenidos y dynamic-security.json (credenciales y ACL del plugin; va en el respaldo)
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i sonda -W 3 -u ${MQTT_SONDA_USUARIO} -P ${MQTT_SONDA_CLAVE} >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Backend (API + pipeline + supervisor) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      args:
        COMMIT: ${COMMIT:-}                      # commit corto que muestra «Acerca de» (docs/19 P11); lo exporta quien construye (pila.sh)
    restart: unless-stopped
    logging:                                     # registros acotados: 10 MB × 5 por servicio (docs/11 §4; 07/10/2026)
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                                      # corre como `node` y no necesita ninguna capacidad (NET_RAW incluida)
    environment:
      DB_NOMBRE: ${DB_NOMBRE}
      # El backend entra con el rol de la aplicación (migración 14), nunca con el dueño de la base (docs/10 §8.4 punto 44). La clave la
      # escribe la persona en el .env y la fija en la base `pruebas/base-rol-app.sh`; vacía, el backend no arranca y dice por qué.
      DB_APP_USUARIO: plataforma_app
      DB_APP_CLAVE: ${DB_APP_CLAVE:-}
      # Limpieza programada y cola vigilada (14/10): sin valor aquí, Compose pasa cada una SOLO si está definida en el .env (si no,
      # no llega y rige el valor por defecto del código). Así se cambian editando el .env y reiniciando el backend, sin tocar
      # este archivo, y una variable vacía sigue deteniendo el arranque (nunca un 0 silencioso). Comprobado con `docker compose config`.
      RETENCION_MEDICION_DIAS:
      RETENCION_TRAMA_DIAS:
      RETENCION_CUARENTENA_DIAS:
      RETENCION_METRICA_BROKER_DIAS:
      RETENCION_ACCESO_DIAS:                     # bitácora de accesos (RF-46, docs/20 §2): 90 días por defecto
      RETENCION_INTERVALO_H:
      METRICA_BROKER_INTERVALO_S:
      METRICA_BROKER_COLA_TOPE:
      # Tope por emisor (docs/10 §8.4 punto 53, 17/10): mismo mecanismo, con los valores por defecto del código si no están en el .env.
      TOPE_LECTURAS_FACTOR:
      TOPE_LECTURAS_MINIMO:
      TOPE_CUARENTENA_HORA:
      CLAVE_TEMPORAL_HORAS:                       # vigencia de la clave temporal de personas, 1–72 h; 2 por defecto (docs/20 §4)
      RESPONSABLE_NOMBRE:                         # responsable de la instancia y su contacto, para privacidad, términos y soporte (docs/21 §6); vacíos, las páginas lo dicen
      RESPONSABLE_CONTACTO:
      CODIGO_FUENTE_URL:                          # enlace al código fuente que exige la AGPL en «Acerca de» (docs/19 P11)
      # El mismo secreto que el proxy pone en X-Proxy-Secreto (punto 52): solo con él el backend cree la dirección de X-Forwarded-For.
      # Ausente, el backend lo avisa al arrancar y usa la dirección del socket; presente y corto, no arranca.
      PROXY_SECRETO:
      DB_HOST: timescaledb                        # nombre del servicio en la red interna (docs/10 §6)
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_BACKEND_CLAVE: ${MQTT_BACKEND_CLAVE}
      MQTT_ADMIN_CLAVE: ${MQTT_ADMIN_CLAVE:-}          # administrador del plugin del broker (docs/10 §8.4 punto 41); vacío = alta por API en 503
      MQTT_SONDA_USUARIO: ${MQTT_SONDA_USUARIO:-sonda}   # nombre reservado: ningún dispositivo puede llamarse como la sonda
      HTTP_CLAVE_ADMIN: ${HTTP_CLAVE_ADMIN:-}          # clave de administrador por cabecera (punto 41): «usuario del sistema» y primer administrador (docs/20 §5)
      HTTP_INTERFAZ: 0.0.0.0                       # todas las interfaces DEL CONTENEDOR; sin `ports` no se ve desde fuera
      HTTP_HOSTS: ${PROXY_NOMBRE:-}                # el nombre público del proxy, además de localhost y 127.0.0.1 (docs/11 §3, docs/10 §8.4 punto 40); vacío en desarrollo
      LOG_FORMATO: json                            # un evento JSON por línea, sin color (docs/10 §6)
      # HTTP_DOCS no se define AQUÍ a propósito: ausente = /docs apagada en el servidor (docs/11 §3).
      # En desarrollo la enciende docker-compose.override.yml.
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    # Sin `ports`: solo se alcanza vía proxy (Etapa 3) o desde otro contenedor de esta red (docs/10 §2 y §6).
    # El HEALTHCHECK ya viene definido en el Dockerfile (llama a GET /salud).

volumes:
  datos-timescale:
  datos-mosquitto:

# Red: Compose crea una red interna "plataforma_default" donde cada servicio se
# alcanza por su nombre (p. ej. el backend se conectará a "timescaledb:5432").
