# Capa opcional del proxy inverso (TT-22; docs/10 §8.4 decisión 10, variante A). Se SUMA al compose base:
#   desarrollo:  docker compose -f docker-compose.yml -f docker-compose.override.yml -f proxy/compose.proxy.yml up -d proxy
#   banco:       bash pruebas/banco/banco.sh proxy        (puertos 8443/8884/8081, certificados de desarrollo)
#   servidor:    la misma capa con PROXY_CERTS apuntando a los certificados reales (docs/10 §8.4 punto 22), PROXY_NOMBRE con el
#                nombre público, PROXY_IP_DISPOSITIVOS=0.0.0.0 (8883) y, SOLO cuando la API exija credencial (M7, docs/11 §7),
#                PROXY_IP_PERSONAS=0.0.0.0 (443 y 80). Dos variables porque docs/11 manda publicar 8883 antes que 443.
# Valores por defecto SEGUROS: escucha solo en 127.0.0.1 y usa la CA de desarrollo; exponer a la red es una decisión
# explícita en el .env del servidor. El único contenedor con puertos hacia fuera en producción es este (docs/10 §2).
services:
  proxy:
    build: ./proxy                       # nginx estable fijada en proxy/Dockerfile (stream, HTTP/2, stub_status y ACME)
    image: plataforma-proxy:local        # construida aquí: su versión vive solo en el FROM de proxy/Dockerfile (docs/11 §8)
    restart: unless-stopped
    logging:                           # registros acotados como el resto (docs/11 §4)
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW                          # como el resto: sin suplantación en la red interna (docs/10 §8.4 punto 52)
    environment:
      # Nombre público que atiende (docs/11 §3, docs/10 §8.4 punto 40): la imagen oficial lo sustituye en la plantilla al arrancar
      # (/docker-entrypoint.d/20-envsubst-on-templates.sh) y escribe /etc/nginx/nginx.conf. Solo PROXY_*: las variables de
      # nginx ($host, $status…) no se tocan. El backend recibe el mismo nombre en HTTP_HOSTS (docker-compose.yml).
      PROXY_NOMBRE: ${PROXY_NOMBRE:-localhost}
      # Secreto compartido con el backend (docs/10 §8.4 punto 52): va en la cabecera X-Proxy-Secreto de cada petición reenviada; con él
      # el backend cree la dirección del cliente de X-Forwarded-For. Obligatorio con esta capa (17/10): sin secreto todas las
      # peticiones compartirían la dirección del proxy y un externo podría bloquear a cualquier dispositivo con cinco tokens falsos.
      PROXY_SECRETO: ${PROXY_SECRETO:?define PROXY_SECRETO en el .env (openssl rand -base64 24), el mismo para el backend}
      NGINX_ENVSUBST_TEMPLATE_DIR: /plantilla
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^PROXY_
    volumes:
      - ./proxy/nginx.conf:/plantilla/nginx.conf.template:ro
      - ${PROXY_CERTS:-../privado/certs-desarrollo}:/certs:ro   # servidor.crt y servidor.key (ca.crt para los clientes)
    ports:
      - "${PROXY_IP_PERSONAS:-127.0.0.1}:${PROXY_HTTPS:-443}:443"       # personas: API, panel, SSE (a Internet solo desde M7)
      - "${PROXY_IP_DISPOSITIVOS:-127.0.0.1}:${PROXY_MQTTS:-8883}:8883" # dispositivos: MQTT sobre TLS
      - "${PROXY_IP_PERSONAS:-127.0.0.1}:${PROXY_HTTP:-80}:80"          # solo redirección a HTTPS (y reto ACME si se elige)
    depends_on:
      backend:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:                         # «¿termina TLS y llega al backend?» (-k: comprueba el camino, no la cadena de confianza)
      # Con el nombre público (--resolve lo lleva a 127.0.0.1): por IP, sin SNI, el proxy rechaza el saludo a propósito.
      test: ["CMD", "curl", "-fsk", "--resolve", "${PROXY_NOMBRE:-localhost}:443:127.0.0.1", "-o", "/dev/null", "https://${PROXY_NOMBRE:-localhost}/salud"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 100M                   # docs/10 §6: 0,1 GB; medido con carga en el banco (docs/16)
          cpus: "0.5"
