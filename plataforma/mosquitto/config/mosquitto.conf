# Configuración del broker — desarrollo local y servidor (el proxy expone 8883 con TLS; el 1883 queda interno).
# Principio: nadie publica ni se suscribe sin credencial, y cada dispositivo solo puede escribir en su propio tópico.
# Desde el 12/10/2026 (docs/10 §8.4 punto 42) las credenciales y la ACL viven en el plugin Dynamic Security, en el
# volumen de datos: el backend crea el cliente de cada dispositivo al darlo de alta (POST /dispositivos), sin reiniciar
# el broker. El archivo lo crea UNA vez `pruebas/broker-inicializar.sh` (administradores `backend-admin` y `admin-guiones`, con la
# misma clave; el rol `admin` y los de roles_del_sistema en pruebas/lib-dynsec.sh: `recepcion`, `sonda`, `pasarela` y `dispositivo`;
# clientes `backend` y `sonda` con las claves del .env). Sin ese archivo el broker no arranca,
# a propósito: nunca arranca sin credenciales.

listener 1883
protocol mqtt
# El identificador de cliente es el usuario (25/11/2026; docs/11 §7, docs/10 §8.4 punto 70). Sin esto, quien extrae la credencial de
# UN equipo podía conectarse con el identificador del backend («backend», sesión persistente): heredaba su suscripción a sitio/# y su
# cola, lo expulsaba y, con sesión limpia, le borraba la cola (medido en un broker desechable; docs/16 §102). Con la opción, el broker
# reemplaza el identificador que manda el cliente por su usuario: nadie puede tomar la sesión de otro usuario. Vale por listener (cada
# `listener` nuevo la lleva), rechaza a quien conecta sin usuario (lo que aquí ya hace allow_anonymous false) y no se relee con la
# señal de recarga: tras cambiarla, reiniciar el broker (mosquitto.conf(5), https://mosquitto.org/man/mosquitto-conf-5.html, consultado el 25/11/2026).
# Consecuencias: el backend se identifica como «backend» y MQTT_CLIENT_ID queda sin efecto aquí (rige en brokers sin la opción, como
# el del banco); dos conexiones con el mismo usuario se expulsan entre
# sí (cada réplica del backend necesitaría su propio usuario); los guiones administran como admin-guiones (pruebas/lib-dynsec.sh).
# Lo exigen el guardián 2i y la prueba pruebas/broker-sesion.sh.
use_username_as_clientid true

# Sin acceso anónimo: toda conexión debe autenticarse (RF-40, RNF-08). Autenticación y ACL: el plugin (docs/11 §7).
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Tope por mensaje: 64 KiB (decisión del 07/10/2026, docs/11 §4). Sin él, la versión 2.0.22 aceptó y entregó un mensaje
# de 50 MiB (observado): un dispositivo con credencial válida, robada o mal programada, podría llenar el disco a
# través de cuarentena y trama. Una trama real pesa cientos de bytes; 64 KiB deja margen para lotes de lecturas
# atrasadas. Cuenta el paquete completo (tópico incluido). Al excederlo, el broker corta la conexión y registra
# «disconnected due to oversize packet»: el mensaje nunca llega al backend.
max_packet_size 65536

# Cola por cliente mientras un suscriptor está caído o atrasado (docs/10 §4.1 y §8.4 punto 43; decidido el 12/10/2026, aplicado
# el 13/10): hasta 10 000 mensajes QoS 1 o 20 MB por sesión (antes regían 1000 y sin tope de bytes). Con 50 dispositivos cada 5 s
# son ≈ 17 min de backend caído antes de perder algo; 20 MB caben de sobra en el techo de 256 MB del contenedor. Lo que sobra se
# descarta en silencio para el emisor: el backend vigila $SYS/broker/publish/messages/dropped y abre la condición del sistema
# «broker_descarte» (el 80 % del tope, 8000, ya avisa). El backend lee el mismo tope en METRICA_BROKER_COLA_TOPE y el guardián
# 2l comprueba que los dos digan 10000.
max_queued_messages 10000
max_queued_bytes 20971520

# Tope de conexiones simultáneas del listener (docs/11 §3 y §4; docs/10 §8.4 punto 57; decidido el 01/11/2026). La flota dimensionada
# en docs/14 §2.1 es de 1 000 nodos; con pasarelas, backend (2 conexiones), sonda y 20 % de holgura: 1 200. Protege la memoria del
# contenedor (techo 256 MB): la conexión que sobra recibe «denied: max_connections exceeded» y se cierra. Plantado el 01/11/2026 en un
# broker desechable con max_connections 3: el cuarto y el quinto cliente fueron rechazados (docs/16 §57). Por sí solo no impide que
# muchas direcciones distintas agoten los cupos: eso lo acota el proxy (100 conexiones por dirección, limit_conn) y lo cierra el
# certificado de cliente por dispositivo (docs/10 §8.4 punto 57, Etapa 4), que rechaza en el saludo TLS a quien no tiene credencial. El guardián 2l
# exige el mismo valor aquí y en el banco.
max_connections 1200

# Persistencia de sesiones y mensajes retenidos en el volumen. Se guarda al cerrar y cada autosave_interval: con 300 s (antes
# 1800), si el contenedor muere de golpe se pierde como mucho lo encolado en los últimos 5 minutos.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Registro a la salida estándar (lo lee `docker compose logs`).
log_dest stdout
log_type error
log_type warning
log_type notice
