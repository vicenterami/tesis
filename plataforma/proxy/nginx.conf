# Proxy inverso de la plataforma: nginx, variante A (docs/10 §8.4 decisión 10; docs/10 §2 y §6).
# Termina TLS en 443 (personas: API, panel, SSE) y en 8883 (dispositivos: MQTT) y reenvía en claro dentro de la red
# interna de Docker. Lo que la variante A pierde está escrito en docs/10: el broker ve la IP del proxy, no la del
# dispositivo (la IP real queda en el registro de este proxy). Un solo archivo, sin includes: lo que rige se lee aquí.
# Certificados en /certs (servidor.crt, servidor.key): en desarrollo los crea proxy/ca-desarrollo.sh; en el servidor,
# la CA que se decida (docs/10 §8.4 punto 22: Let's Encrypt por ACME o CA propia).
# Este archivo es una PLANTILLA: el compose lo monta en /plantilla/nginx.conf.template y la imagen oficial, al arrancar,
# sustituye solo las variables PROXY_* (filtro ^PROXY_: PROXY_NOMBRE y PROXY_SECRETO) y escribe /etc/nginx/nginx.conf. Las demás
# ($host, $status…) son de nginx y quedan intactas. PROXY_NOMBRE es el nombre público del servidor (.env); sin definir, localhost.
# PROXY_SECRETO es obligatorio con esta capa (compose.proxy.yml): sin él el proxy no arranca.
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }

# ── Dispositivos: MQTT sobre TLS, 8883 → mosquitto:1883 ──────────────────────────────────────────────────────────
stream {
    # Una línea JSON por conexión (docs/10 §6): quién se conectó, cuánto duró, cuánto movió. Es el único lugar donde
    # queda la IP real del dispositivo en la variante A.
    log_format mqtt escape=json '{"t":"$time_iso8601","proto":"mqtt","ip":"$remote_addr","estado":"$status",'
                                '"bytes_in":$bytes_received,"bytes_out":$bytes_sent,"dur_s":$session_time}';
    access_log /dev/stdout mqtt;

    # Tope de conexiones simultáneas por dirección en el 8883 (docs/11 §3, 22/10/2026). 100, con este fundamento:
    #  - Demanda legítima: una dirección pública puede ser un NAT o una pasarela con todos los nodos de un sitio detrás, y cada
    #    nodo mantiene UNA sesión MQTT. El caso de validación tiene 50 canales (docs/02, fundamento de RNF-01: «50 canales que
    #    reportan cada 5 minutos»), o sea a lo más 50 nodos de un canal; 100 deja el doble de holgura.
    #  - Techo del proceso: worker_connections 1024 y cada sesión usa dos (cliente y broker), unas 512 sesiones por worker;
    #    con 100 por dirección hacen falta al menos 6 direcciones para saturar un worker, no una sola.
    # La conexión 101 desde una misma dirección se corta al aceptarla (en el stream no hay código HTTP: cierra la conexión) y queda
    # en el registro de errores (limit_conn_log_level warn). El tope no cuenta el tiempo: una sesión sana dura horas (proxy_timeout 1h).
    # Una dirección vacía no se cuenta: ver $clave_conexion (la propia 127.0.0.1 del contenedor queda exenta).
    map $remote_addr $clave_conexion { 127.0.0.1 ""; default $binary_remote_addr; }
    limit_conn_zone $clave_conexion zone=mqtt_por_ip:1m;     # 1 MB guarda ≈ 32 000 estados de 32 bytes: sobra para 6 000+ direcciones
    limit_conn_log_level warn;

    server {
        listen 8883 ssl;
        limit_conn mqtt_por_ip 100;
        ssl_certificate     /certs/servidor.crt;
        ssl_certificate_key /certs/servidor.key;
        ssl_protocols       TLSv1.2 TLSv1.3;            # docs/10 §2: TLS 1.2 o superior
        ssl_session_cache   shared:mqtt:1m;
        # Resolver en cada conexión con el DNS interno de Docker, no una vez al arrancar: si el broker se recrea con
        # otra IP, el proxy lo sigue (y `nginx -t` pasa aunque el nombre no exista fuera de la red de Compose).
        resolver            127.0.0.11 valid=10s ipv6=off;
        set $broker         mosquitto:1883;
        proxy_pass          $broker;
        proxy_connect_timeout 5s;
        proxy_timeout       1h;                          # una sesión MQTT viva con keepalive no es un «timeout»
    }
}

# ── Personas: HTTPS, 443 → backend:3000 ──────────────────────────────────────────────────────────────────────────
http {
    log_format api escape=json '{"t":"$time_iso8601","proto":"http","ip":"$remote_addr","met":"$request_method",'
                               '"ruta":"$uri","estado":$status,"bytes":$body_bytes_sent,"dur_s":$request_time}';
    access_log /dev/stdout api;
    server_tokens off;                                   # no se anuncia la versión (docs/11)

    # ── Límite de tasa por dirección (docs/11 §3, 22/10/2026) ────────────────────────────────────────────────────────
    # Lo que ve cada zona es la dirección del socket ($binary_remote_addr; $remote_addr es la del cliente, no hay otro proxy delante).
    # La del propio contenedor (127.0.0.1: el chequeo de salud, cada 15 s) queda exenta: una clave vacía no se cuenta.
    map $remote_addr $clave_tasa { 127.0.0.1 ""; default $binary_remote_addr; }
    # Rutas que ESCRIBEN y administran (alta, baja y rotación de dispositivos y pasarelas): método que cambia estado sobre
    # /dispositivos o /pasarelas. La recepción (POST /recepcion/{id}) NO entra aquí: es tráfico de dispositivos y cuenta en la zona general.
    map "$request_method $uri" $clave_tasa_admin {
        default "";
        # ~* : sin distinguir mayúsculas, porque el enrutador de Express tampoco las distingue (docs/10 §8.4 punto 52): POST /Dispositivos
        # llega al mismo controlador y debe contar en esta zona. $clave_tasa: la dirección propia del contenedor queda exenta, como en las demás.
        "~*^(POST|PUT|PATCH|DELETE) /(dispositivos|pasarelas)(/|$)" $clave_tasa;
    }
    # (a) General: 100 peticiones/s por dirección, ráfaga 200 sin espera.
    #   - Demanda legítima máxima: RNF-01 exige 50 eventos/s (docs/02) y, por la vía HTTP, un NAT o una pasarela puede enviar de una sola
    #     dirección las tramas de todos sus dispositivos; cada dispositivo manda a lo más 1 trama/s aceptada (docs/10 §8.4 punto 52 e),
    #     de modo que 50 dispositivos detrás de una dirección dan 50 peticiones/s. 100 r/s es el doble (holgura para el panel y los
    #     tokens equivocados de un lote), y la ráfaga de 200 son 4 s del ritmo de RNF-01: cubre la cola acumulada que los 50 canales
    #     reenvían tras una caída de red (docs/02, fundamento de RNF-01) y las 30–40 peticiones con que el panel carga una pantalla.
    #   - Frena lo abusivo: sostenidos, más de 100 r/s desde una dirección ya no son uso de un sitio de 50 canales.
    #   - Costo de la zona: 10 MB guardan ≈ 160 000 direcciones (64 bytes por estado en nginx).
    limit_req_zone $clave_tasa zone=general:10m rate=100r/s;
    # (b) Administración que escribe: 5 peticiones/s, ráfaga 10. El backend ya admite a lo más 2 altas a la vez (docs/10 §3, 429) y cada
    #     alta espera al broker; 5 r/s sostenidos con un lote de 10 seguidos cubre dar de alta un sitio entero a mano o con un guion,
    #     y es 20 veces menos que la zona general: quien intenta adivinar la clave de administrador (X-Clave-Admin, docs/10 §8.4 punto 41)
    #     tiene a lo más 5 intentos por segundo y por dirección.
    limit_req_zone $clave_tasa_admin zone=administracion:1m rate=5r/s;
    limit_req_status 429;                                # «demasiadas peticiones» (RFC 6585), no el 503 por omisión
    limit_req_log_level warn;                            # cada rechazo queda en el registro de errores con la zona y la dirección
    # (c) Conexiones simultáneas por dirección en HTTP (22/10/2026, revisión del bloque): limit_req cuenta inicios de petición, no
    #     duración; sin esto, una dirección abre 200 peticiones lentas y agota worker_connections (1024, dos por petición). 100 por
    #     dirección, el mismo fundamento que en el 8883 (50 dispositivos de un NAT, el doble de holgura). En HTTP/2 cada petición en
    #     curso cuenta como una conexión.
    limit_conn_zone $clave_tasa zone=http_por_ip:1m;
    # (d) Flujos del canal en vivo (/eventos, SSE) por dirección: 20 = 10 pantallas abiertas a la vez detrás de un NAT con dos pestañas
    #     cada una; el backend admite 50 flujos en total (docs/10 §5), así que una sola dirección ya no puede tomarlos todos.
    limit_conn_zone $clave_tasa zone=eventos_por_ip:1m;
    limit_conn_status 429;
    limit_conn_log_level warn;

    # Lista de nombres de host (docs/11 §3, docs/10 §8.4 punto 40, 12/10/2026): se atiende SOLO el nombre público. Cualquier otro
    # (el de una página que hace DNS rebinding, o un escaneo por IP) cae en este servidor por defecto, que rechaza el saludo
    # TLS (SNI desconocido) y no entrega ni el certificado. El backend repite el control con su propia lista (HTTP_HOSTS).
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ${PROXY_NOMBRE};
        ssl_certificate     /certs/servidor.crt;
        ssl_certificate_key /certs/servidor.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:api:1m;
        # HSTS lo pone el proxy, no el backend (docs/11 §5: «sin HSTS en el backend, lo pondrá el proxy TLS»).
        add_header Strict-Transport-Security "max-age=31536000" always;

        resolver 127.0.0.11 valid=10s ipv6=off;        # ídem: el backend se recrea en cada `up --build`
        set $backend http://backend:3000;

        # Lo que comparten las dos ubicaciones (se hereda: ninguna redefine proxy_set_header).
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;                # con puerto: el canal SSE compara Origin con Host ($host lo quita y el banco, en 8443, se rechazaba)
        proxy_set_header   X-Forwarded-For $remote_addr;
        # Prueba de que la petición viene de este proxy (docs/10 §8.4 punto 52): con el secreto, el backend cree X-Forwarded-For.
        # Si PROXY_SECRETO está vacío, nginx no manda una cabecera vacía, y el backend usa la dirección del socket.
        proxy_set_header   X-Proxy-Secreto "${PROXY_SECRETO}";
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection "";
        proxy_buffering    off;                      # SSE (decisión 1): cada evento sale al navegador al instante
        proxy_read_timeout 1h;                       # una conexión SSE abierta tampoco es un «timeout»

        location / {
            limit_req          zone=general burst=200 nodelay;
            limit_req          zone=administracion burst=10 nodelay;
            limit_conn         http_por_ip 100;
            proxy_pass         $backend;
        }
        # Canal en vivo: mismas reglas más el tope de flujos simultáneos por dirección (docs/11 §3; docs/16 §47). Expresión regular sin
        # distinguir mayúsculas y con barra final opcional: Express sirve también /Eventos y /eventos/ (comprobado el 22/10 contra el
        # backend), y con «location =» esas rutas caían en «location /», sin este tope (revisión del 22/10).
        location ~* ^/eventos/?$ {
            limit_req          zone=general burst=200 nodelay;
            limit_conn         eventos_por_ip 20;
            proxy_pass         $backend;
        }
    }

    # Puerto 80: solo redirige a HTTPS (y alojará el reto ACME si se elige Let's Encrypt, docs/10 §8.4 punto 22). Sin TLS no se sirve nada.
    # Solo para el nombre público; cualquier otro Host se corta sin respuesta (444). En 443 el equivalente es el saludo TLS
    # rechazado (SNI ajeno) o el 421 (SNI propio con otro Host).
    server {
        listen 80 default_server;
        return 444;
    }
    server {
        listen 80;
        server_name ${PROXY_NOMBRE};
        return 301 https://$host$request_uri;
    }
}
