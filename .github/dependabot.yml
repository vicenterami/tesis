# Actualizaciones propuestas como pull request (docs/11 §4). Las imágenes base y las acciones están fijadas por digest o SHA, y
# los paquetes npm por versión exacta; este archivo hace que las versiones nuevas lleguen avisadas. Nunca fusiona solo: lo
# revisa y fusiona el estudiante. Antes de fusionar uno de npm: que pnpm-workspace.yaml (overrides, allowBuilds, audit) siga
# intacto, porque Dependabot regenera el lockfile pero no conoce esas reglas.
# Ojo: el CI prueba los PR de acciones (las usa) y los de npm, pero NO los de imágenes (no construye imágenes). Antes de fusionar uno de
# imágenes: `bash plataforma/pruebas/escanear-imagenes.sh` y el banco en local (docs/11 §8).
# cooldown: espera 7 días desde que se publica una versión antes de proponerla (lo recién publicado no se instala).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /plataforma/backend
      - /plataforma/db/imagen
      - /plataforma/proxy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node se queda en la 22 (package.json: engines >=22 <23); cambiar de versión mayor es una decisión aparte.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # nginx: la serie par (1.30.x) es la estable; la impar (1.31) es la de desarrollo (mainline).
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /plataforma
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Imágenes construidas aquí (base y proxy derivados): no existen en ningún registro (08/10: el primer intento falló con 401).
      - dependency-name: "plataforma-*"
  # Dependencias de Node: backend y panel son un solo workspace con un solo pnpm-lock.yaml en /plataforma/backend (23/10/2026).
  # Hasta hoy nadie proponía versiones nuevas de npm: el CI avisaba recién cuando un aviso de seguridad lo ponía en rojo
  # (23/10: vite 8.3.2, aviso publicado después de la última corrida). package.json fija versiones exactas (save-exact en
  # .npmrc) y Dependabot las propone igual de exactas (PR del 23/10).
  - package-ecosystem: npm
    directory: /plataforma/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Un PR por semana con todos los parches y versiones menores; las mayores van sueltas y se deciden una a una.
      menores-y-parches:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    ignore:
      # Los tipos de Node siguen a la versión que corre (engines >=22 <23 y la imagen node:22): cambiar de mayor es una decisión aparte.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
